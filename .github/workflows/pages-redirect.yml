# The old address (sonusinghtomar.github.io/vision-toastmasters) forwards to the app.
# It only needs publishing when the redirect files change.
name: Old address redirect

on:
  push:
    branches: [main]
    paths: ['redirect/**', 'sw.js']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp sw.js redirect/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
